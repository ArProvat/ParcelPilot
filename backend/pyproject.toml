[project]
name = "parcelpilot"
version = "0.1.0"
description = "AI-powered logistics, customer support, and decision intelligence agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.30",
    "langchain-openai>=0.1.0",
    "langchain-postgres>=0.0.1",
    "langgraph-checkpoint-postgres>=0.0.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg[binary,pool]>=3.1.18",
    "pgvector>=0.2.5",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pypdf>=4.1.0",
    "openpyxl>=3.1.2",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
